name: lite

on:
  push:
    branches: [develop, main]
    paths: ['lite/**', '.github/workflows/lite.yml']
  pull_request:
    branches: [develop, main]
    paths: ['lite/**', '.github/workflows/lite.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Uji Dapur Nusantara Lite
        working-directory: lite
        run: npm test
